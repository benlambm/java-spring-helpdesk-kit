spring.application.name=helpdesk

# No spring.datasource.url here on purpose: with none set, Spring Boot starts an
# in-memory H2 database. To use PostgreSQL, set these three environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

# Run schema.sql on every start, for H2 and PostgreSQL alike.
spring.sql.init.mode=always

# Render and Railway tell the app which port to use through PORT.
server.port=${PORT:8080}

# Where HelpDeskRunner reads the CSV and writes the report.
helpdesk.csv-file=data/tickets.csv
helpdesk.report-file=output/category-summary.txt
